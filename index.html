<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Florida Man Generator</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div class="container">

    <!-- LEFT -->
    <div class="headline-section">
      <h1 id="headline">
        Click a date to generate your Florida Man headline
      </h1>
      <p id="meta"></p>
      <p id="source"></p>
      <p id="verify"></p>
    </div>

    <!-- RIGHT -->
    <div class="controls">

      <div class="calendar-box">

        <!-- DAYS -->
        <div class="days" id="days"></div>

        <!-- MONTHS -->
        <div class="months" id="months"></div>

      </div>

      <button id="generateBtn">FIND MY MAN!</button>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
